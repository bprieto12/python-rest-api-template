# Minimal collector for local development: accept OTLP and log it to the
# console (docker compose logs -f otel-collector). No local visualization
# backend on purpose — production/staging ship to CloudWatch instead (see
# ecs/task-definition.*.json's aws-otel-collector sidecar and
# terraform/dashboard.tf); swap the `debug` exporter below for your own
# real backend if you want one locally too.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: normal

service:
  telemetry:
    metrics:
      # The collector's own internal metrics — curl :8888/metrics for ad-hoc
      # inspection, no scraper required.
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
