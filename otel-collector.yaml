# Minimal collector for local development: accept OTLP, log it, and expose
# metrics for Prometheus to scrape on :8889. Swap the exporters for your real
# backend (AWS X-Ray / CloudWatch / Amazon Managed Prometheus) in each cluster.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: normal
  prometheus:
    endpoint: 0.0.0.0:8889
    # Turn OTel resource attributes (service.name, deployment.environment, ...)
    # into Prometheus labels so you can filter by them.
    resource_to_telemetry_conversion:
      enabled: true

service:
  telemetry:
    metrics:
      # Expose the collector's own metrics so Prometheus can scrape :8888.
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, prometheus]
