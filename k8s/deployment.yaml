apiVersion: apps/v1
kind: Deployment
metadata:
  name: books-api
  namespace: books-api
  labels:
    app.kubernetes.io/name: books-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: books-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: books-api
    spec:
      serviceAccountName: books-api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Run DB migrations before any app container starts.
      initContainers:
        - name: migrate
          image: books-api  # image tag is patched by CD (kustomize edit set image)
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: books-api-config
            - secretRef:
                name: books-api-secrets
      containers:
        - name: api
          image: books-api
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: books-api-config
            - secretRef:
                name: books-api-secrets
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
