apiVersion: v1
kind: ConfigMap
metadata:
  name: books-api-config
  namespace: books-api
data:
  ENVIRONMENT: "production"
  DEBUG: "false"
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "books-api"
  # In-cluster collector (e.g. the ADOT collector running as a sidecar/daemonset).
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_METRIC_EXPORT_INTERVAL_MS: "15000"
