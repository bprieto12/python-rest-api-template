# Requires the AWS Load Balancer Controller in the cluster. Creates an
# internet-facing ALB that health-checks /healthz.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: books-api
  namespace: books-api
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:000000000000:certificate/xxxx
spec:
  ingressClassName: alb
  rules:
    - host: books-api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: books-api
                port:
                  number: 80
