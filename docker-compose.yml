# Local dev stack: Postgres + OpenTelemetry Collector + Prometheus + Grafana + the API.
#   docker compose up --build
# The API waits for Postgres, runs migrations, seeds mock data, then serves on :8000.
#   API      http://localhost:8000/docs
#   Grafana  http://localhost:3000   (no login; "Books API — Overview" dashboard)
#   Prom     http://localhost:9090

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: books
      POSTGRES_PASSWORD: books
      POSTGRES_DB: books
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U books -d books"]
      interval: 5s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # collector's own internal metrics
      - "8889:8889"   # Prometheus scrape endpoint (app metrics re-exported)

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"   # Prometheus UI — http://localhost:9090
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      # Local dev only: no login, everyone is admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"   # Grafana UI — http://localhost:3000 (dashboard: "Books API — Overview")
    depends_on:
      - prometheus

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://books:books@db:5432/books
      OTEL_SERVICE_NAME: books-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "8000:8000"
    command:
      - sh
      - -c
      - "alembic upgrade head && python scripts/seed.py && uvicorn books_api.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
  promdata:
  grafanadata:
