# Local dev stack: Postgres + an OpenTelemetry Collector + the API.
#   docker compose up --build
# The API waits for Postgres, runs migrations, seeds mock data, then serves on :8000.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: books
      POSTGRES_PASSWORD: books
      POSTGRES_DB: books
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U books -d books"]
      interval: 5s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus scrape endpoint (collector-exported metrics)

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://books:books@db:5432/books
      OTEL_SERVICE_NAME: books-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "8000:8000"
    command:
      - sh
      - -c
      - "alembic upgrade head && python scripts/seed.py && uvicorn books_api.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
