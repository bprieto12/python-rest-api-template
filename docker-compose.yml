# Local dev stack: DynamoDB Local + OpenTelemetry Collector + Prometheus + Grafana + the API.
#   docker compose up --build
# The API waits for DynamoDB Local, creates tables + seeds mock data, then serves on :8000.
#   API      http://localhost:8000/docs
#   Grafana  http://localhost:3000   (no login; "Books API — Overview" dashboard)
#   Prom     http://localhost:9090

services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.4
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      # Host 8001, not 8000 — that's the api container below. The api
      # container itself talks to this one over the compose network at
      # dynamodb-local:8000 regardless; this mapping is only so you can point
      # the AWS CLI at http://localhost:8001 from your own machine to poke
      # around (`aws dynamodb scan --endpoint-url http://localhost:8001 ...`).
      - "8001:8000"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # collector's own internal metrics
      - "8889:8889"   # Prometheus scrape endpoint (app metrics re-exported)

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"   # Prometheus UI — http://localhost:9090
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      # Local dev only: no login, everyone is admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"   # Grafana UI — http://localhost:3000 (dashboard: "Books API — Overview")
    depends_on:
      - prometheus

  api:
    build: .
    depends_on:
      dynamodb-local:
        condition: service_started
      otel-collector:
        condition: service_started
    environment:
      ENVIRONMENT: local
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local # DynamoDB Local ignores credentials entirely — any
      AWS_SECRET_ACCESS_KEY: local # non-empty value satisfies the SDK's "has credentials" check
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      OTEL_SERVICE_NAME: books-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "8000:8000"
    command:
      - sh
      - -c
      - "python scripts/seed.py --create-tables && uvicorn books_api.main:app --host 0.0.0.0 --port 8000"

volumes:
  promdata:
  grafanadata:
