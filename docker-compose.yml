# Local dev stack: DynamoDB Local + OpenTelemetry Collector + the API + Kong.
#   docker compose up --build
# The API waits for DynamoDB Local, creates tables + seeds mock data, then serves on :8000.
#   API (direct, unauthenticated, unlimited) http://localhost:8000/docs
#   Kong (rate-limited, :20/min)             http://localhost:8010/api/v1/books
#   Telemetry  docker compose logs -f otel-collector   (traces/metrics logged to console — see otel-collector.yaml)
#
# No local metrics visualization stack (Prometheus/Grafana) on purpose —
# production/staging telemetry lives in a real CloudWatch dashboard
# (terraform/dashboard.tf, see docs/RUNBOOK.md's "How to view metrics"),
# and keeping a second, local-only dashboard around just for dev risked
# people looking at the wrong one.
#
# Kong runs here purely to exercise the rate-limiting behavior — it doesn't
# verify a JWT locally (there's no Cognito to check one against; see
# ecs/kong/kong.local.yml). The real, per-environment config (JWT-enforced,
# per-consumer limits) is generated by ecs/kong/render_config.py, not this
# file — see terraform/kong.tf and terraform/README.md.

services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.4
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      # Host 8001, not 8000 — that's the api container below. The api
      # container itself talks to this one over the compose network at
      # dynamodb-local:8000 regardless; this mapping is only so you can point
      # the AWS CLI at http://localhost:8001 from your own machine to poke
      # around (`aws dynamodb scan --endpoint-url http://localhost:8001 ...`).
      - "8001:8000"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # collector's own internal metrics (curl for ad-hoc inspection)

  api:
    build: .
    depends_on:
      dynamodb-local:
        condition: service_started
      otel-collector:
        condition: service_started
    environment:
      ENVIRONMENT: local
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local # DynamoDB Local ignores credentials entirely — any
      AWS_SECRET_ACCESS_KEY: local # non-empty value satisfies the SDK's "has credentials" check
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      OTEL_SERVICE_NAME: books-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    ports:
      - "8000:8000"
    command:
      - sh
      - -c
      - "python scripts/seed.py --create-tables && uvicorn books_api.main:app --host 0.0.0.0 --port 8000"

  kong:
    image: kong:3.7
    depends_on:
      api:
        condition: service_started
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      KONG_ADMIN_LISTEN: "off"
    volumes:
      - ./ecs/kong/kong.local.yml:/kong.yml:ro
    ports:
      - "8010:8000" # proxy — the rate-limited path (see the file header comment above)
      - "8110:8100" # status/health
