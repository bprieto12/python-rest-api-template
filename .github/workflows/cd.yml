name: CD

# Push to main -> staging, automatically, for fast feedback on every merge.
# Push a v* tag -> production, a deliberate human step that promotes the
# exact same image already tested in staging (see build-and-push: it always
# reuses whatever's already in ECR for this commit SHA, never rebuilds).
# workflow_dispatch can target either, manually, for a redeploy without a
# new commit (e.g. after an infra-only fix).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC federation into AWS — no static keys
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: books-api # shared across environments — one image, promoted, never rebuilt per-environment
  ECS_CONTAINER_NAME: api

jobs:
  set-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.compute.outputs.environment }}
      name_prefix: ${{ steps.compute.outputs.name_prefix }}
    steps:
      - id: compute
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            environment="${{ inputs.environment }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            environment="production"
          else
            environment="staging"
          fi
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          # "production" keeps every name exactly as it was before other
          # environments existed here (no suffix) — see
          # terraform/environment.tf for why; ecs/bootstrap.sh mirrors this
          # same rule.
          if [ "$environment" = "production" ]; then
            echo "name_prefix=books-api" >> "$GITHUB_OUTPUT"
          else
            echo "name_prefix=books-api-$environment" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: set-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.set-environment.outputs.environment }} # needed to see the AWS_DEPLOY_ROLE_ARN secret, which is scoped per Environment
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Compute image ref
        id: meta
        run: echo "image=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - name: Build and push (skip if this commit's image already exists)
        # A tag push re-promotes a commit already built and pushed by an
        # earlier main-branch run — rebuilding would still work, but
        # skipping means production always deploys the literal artifact
        # staging already ran, not a fresh (if identical-source) rebuild.
        run: |
          if docker manifest inspect "${{ steps.meta.outputs.image }}" >/dev/null 2>&1; then
            echo "Image already exists for $GITHUB_SHA — reusing it, not rebuilding."
          else
            docker buildx build --push \
              --cache-from type=gha --cache-to type=gha,mode=max \
              -t "${{ steps.meta.outputs.image }}" \
              -t "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest" \
              .
          fi

  deploy:
    needs: [set-environment, build-and-push]
    runs-on: ubuntu-latest
    environment: ${{ needs.set-environment.outputs.environment }}
    env:
      NAME_PREFIX: ${{ needs.set-environment.outputs.name_prefix }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render task definition with the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs/task-definition.${{ needs.set-environment.outputs.environment }}.json
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.image }}

      - name: Register the task definition revision
        id: register
        run: |
          arn=$(aws ecs register-task-definition \
            --cli-input-json "file://${{ steps.render.outputs.task-definition }}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered $arn"
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Update the service and wait for it to stabilize
        # --service-connect-configuration is resent explicitly, every deploy
        # — confirmed against real staging infra that UpdateService silently
        # *clears* serviceConnectConfiguration if it's omitted, it does not
        # leave it unchanged the way task-definition/desired-count do (which
        # is why those two are plain `ignore_changes` in Terraform instead of
        # something CD has to keep resending). Omitting this once wiped
        # Kong's only path to books-api and sent the service into a
        # deployment-circuit-breaker loop.
        #
        # Passed as JSON, not CLI shorthand — shorthand's nested
        # list-of-maps-of-list-of-maps here (services=[{...clientAliases=[{...}]}])
        # silently no-ops on this API (confirmed: three deploys in a row set
        # it with no error, and serviceConnectConfiguration stayed null the
        # whole time). AWS's own docs for this flag use JSON for exactly this
        # reason. The shape must stay in sync with aws_ecs_service.this's
        # service_connect_configuration block in terraform/main.tf —
        # namespace is "$NAME_PREFIX.internal" (terraform/kong.tf's
        # aws_service_discovery_http_namespace), portName "api" and
        # containerPort 8000 come from the api container's named portMapping
        # in ecs/task-definition.<environment>.json.
        run: |
          SERVICE_CONNECT_CONFIG='{"enabled":true,"namespace":"'"${NAME_PREFIX}"'.internal","services":[{"portName":"api","clientAliases":[{"port":8000,"dnsName":"books-api"}]}]}'
          aws ecs update-service \
            --cluster "$NAME_PREFIX" \
            --service "$NAME_PREFIX" \
            --task-definition "${{ steps.register.outputs.arn }}" \
            --service-connect-configuration "$SERVICE_CONNECT_CONFIG" \
            --force-new-deployment

          # `wait services-stable` gives up after ~10 minutes (its fixed
          # 40 x 15s polling budget, not configurable via CLI flags). A
          # brand-new environment's very first deploy routinely takes longer
          # than that: Terraform creates this service (as part of the same
          # release) before any real image exists in a freshly-emptied ECR
          # repo, so ECS burns through several failed-pull retries before
          # this step's own freshly-pushed image supersedes them — confirmed
          # against a real from-scratch teardown+bootstrap+release, both for
          # this service and for Kong's. The deployment does converge on its
          # own; it just needs more than one wait cycle to prove it. A
          # steady-state deploy (the common case) still finishes on the
          # first attempt — this loop costs nothing when nothing's wrong.
          for attempt in 1 2 3; do
            if aws ecs wait services-stable --cluster "$NAME_PREFIX" --services "$NAME_PREFIX"; then
              exit 0
            fi
            echo "Still not stable after wait cycle $attempt/3 — checking again (this is expected on a service's very first deploy)."
          done
          echo "::error::$NAME_PREFIX did not stabilize after 3 wait cycles (~30 min) — this is past the first-deploy cold-start window, so something else is actually wrong. Check ECS service events."
          exit 1

  # Kong (terraform/kong.tf) gets its own image, built fresh on every deploy
  # rather than promoted-unchanged like books-api's — its declarative config
  # (kong.yml) bakes in the *current* Cognito consumer list, so "the same
  # artifact staging already ran" doesn't apply the same way here: a new
  # consumer added between the staging and production releases should still
  # show up in production's build. See ecs/kong/render_config.py for what
  # actually generates kong.yml, and terraform/README.md for why Kong exists
  # in the request path at all (API Gateway's JWT authorizer alone can't do
  # per-consumer rate limiting on apigatewayv2).
  build-and-push-kong:
    needs: set-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.set-environment.outputs.environment }}
    env:
      ECR_REPOSITORY: kong
      NAME_PREFIX: ${{ needs.set-environment.outputs.name_prefix }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Compute image ref
        id: meta
        run: echo "image=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Discover the Cognito user pool
        # Self-discovered from AWS, not a pre-set GitHub variable. This used
        # to read a COGNITO_USER_POOL_ID GitHub Environment variable that
        # only scripts/bootstrap.sh's interactive local flow ever sets —
        # confirmed the hard way that a fresh teardown+bootstrap+release
        # cycle can reach this job with that variable never populated
        # (nothing about a release *requires* someone to have successfully
        # run bootstrap.sh's local flow first), which sent an empty user
        # pool id into the JWKS URL below and got a 400 from Cognito. The
        # pool's name is deterministic (local.name_prefix,
        # terraform/cognito.tf), so there's nothing that actually needs
        # wiring up by hand — CD can just ask AWS.
        run: |
          POOL_ID=$(aws cognito-idp list-user-pools --max-results 60 \
            --query "UserPools[?Name=='${NAME_PREFIX}'].Id | [0]" --output text)
          if [ -z "$POOL_ID" ] || [ "$POOL_ID" = "None" ]; then
            echo "::error::No Cognito user pool named '$NAME_PREFIX' found — has terraform apply run for this environment yet?"
            exit 1
          fi
          echo "Found user pool: $POOL_ID"
          echo "COGNITO_USER_POOL_ID=$POOL_ID" >> "$GITHUB_ENV"

      - name: Fetch Cognito's JWKS
        # Public endpoint, no auth needed — just the user pool id.
        run: |
          curl -fsS "https://cognito-idp.${AWS_REGION}.amazonaws.com/${COGNITO_USER_POOL_ID}/.well-known/jwks.json" \
            -o ecs/kong/jwks.json

      - name: List consumers (name -> client_id)
        # CD has no Terraform state access (that's TF_DEPLOY_ROLE_ARN, a
        # different role) — reads the live consumer list from Cognito
        # directly instead of `terraform output cognito_client_ids`. Client
        # names are "$NAME_PREFIX-<consumer>" (terraform/cognito.tf); strip
        # the prefix to get back the bare name render_config.py expects.
        run: |
          aws cognito-idp list-user-pool-clients \
            --user-pool-id "${COGNITO_USER_POOL_ID}" \
            --query 'UserPoolClients[].{Name:ClientName,Id:ClientId}' --output json \
          | jq --arg prefix "${NAME_PREFIX}-" \
              'map({(.Name | sub("^" + $prefix; "")): .Id}) | add' \
            > ecs/kong/consumers.json
          cat ecs/kong/consumers.json

      - name: Determine the signing kid from a real token
        # Cognito can (and, against this account, does) publish more than
        # one active RSA signing key at once — the JWKS list alone gives no
        # way to tell which one current tokens are actually signed with, and
        # guessing wrong means Kong rejects every real token with "Invalid
        # signature" (confirmed the hard way against real staging infra).
        # Fetching one real token and reading its header's `kid` is the only
        # reliable way to know.
        #
        # Everything needed for that probe is discovered here too, not read
        # from GitHub secrets/variables — same reasoning as the user pool
        # discovery above. The "default" consumer's client id comes straight
        # out of consumers.json (already fetched); its secret is fetched
        # directly from Cognito (DescribeUserPoolClient — the CD role reads
        # it itself instead of it being copied into a separate GitHub secret
        # that has to be kept in sync by hand); the domain is deterministic
        # (cognito.tf: "${local.name_prefix}-${account_id}"). This has
        # nothing to do with which consumers actually get provisioned in
        # kong.yml — "default" is used purely because it's guaranteed to
        # exist (var.api_consumers' own default).
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          DEFAULT_CLIENT_ID=$(python3 -c "import json; print(json.load(open('ecs/kong/consumers.json'))['default'])")
          DEFAULT_CLIENT_SECRET=$(aws cognito-idp describe-user-pool-client \
            --user-pool-id "${COGNITO_USER_POOL_ID}" --client-id "$DEFAULT_CLIENT_ID" \
            --query 'UserPoolClient.ClientSecret' --output text)
          RESPONSE=$(curl -sS -u "$DEFAULT_CLIENT_ID:$DEFAULT_CLIENT_SECRET" \
            -d grant_type=client_credentials -d "scope=books-api/read" \
            "https://${NAME_PREFIX}-${ACCOUNT_ID}.auth.${AWS_REGION}.amazoncognito.com/oauth2/token")
          TOKEN=$(python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])" <<<"$RESPONSE" 2>/dev/null || true)
          if [ -z "$TOKEN" ]; then
            echo "::error::Failed to get a probe token from Cognito. Response: $RESPONSE"
            exit 1
          fi
          KID=$(echo "$TOKEN" | cut -d. -f1 | python3 -c "
          import sys, base64, json
          s = sys.stdin.read().strip()
          s += '=' * (-len(s) % 4)
          print(json.loads(base64.urlsafe_b64decode(s))['kid'])
          ")
          echo "Signing kid from a live token: $KID"
          echo "SIGNING_KID=$KID" >> "$GITHUB_ENV"

      - name: Render kong.yml
        run: |
          pip install --quiet cryptography
          python3 ecs/kong/render_config.py \
            --jwks ecs/kong/jwks.json \
            --consumers ecs/kong/consumers.json \
            --rate-limits "ecs/kong/rate-limits.${{ needs.set-environment.outputs.environment }}.json" \
            --upstream-host books-api \
            --upstream-port 8000 \
            --signing-kid "$SIGNING_KID" \
            --out ecs/kong/kong.yml
          rm -f ecs/kong/jwks.json ecs/kong/consumers.json # client ids aren't secret, but no reason to leave them in the build context after use

      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        # Deliberately NOT skip-if-this-commit's-image-already-exists, unlike
        # the plain `build-and-push` job above — that optimization assumes
        # the image is a pure function of the code at this commit, which is
        # true for books-api but not Kong: its image also bakes in *live*
        # Cognito state (consumer list, JWKS) fetched moments ago, not
        # anything tied to the git SHA. Skipping a rebuild here on the
        # (mistaken) assumption that "this commit already has an image"
        # risks redeploying a Kong image whose baked-in client ids no longer
        # match Cognito's current ones — e.g. after Cognito gets recreated
        # (a teardown+bootstrap cycle) without the git SHA changing, or any
        # other case where a workflow re-runs against the same commit.
        # Always rebuilding costs little; this image is small and has no
        # compile step.
        run: |
          docker buildx build --push \
            --cache-from type=gha,scope=kong --cache-to type=gha,mode=max,scope=kong \
            -t "${{ steps.meta.outputs.image }}" \
            -t "${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest" \
            ecs/kong

  deploy-kong:
    needs: [set-environment, build-and-push-kong]
    runs-on: ubuntu-latest
    environment: ${{ needs.set-environment.outputs.environment }}
    env:
      NAME_PREFIX: ${{ needs.set-environment.outputs.name_prefix }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render task definition with the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs/task-definition.kong.${{ needs.set-environment.outputs.environment }}.json
          container-name: kong
          image: ${{ needs.build-and-push-kong.outputs.image }}

      - name: Register the task definition revision
        id: register
        run: |
          arn=$(aws ecs register-task-definition \
            --cli-input-json "file://${{ steps.render.outputs.task-definition }}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered $arn"
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Update the service and wait for it to stabilize
        # --service-connect-configuration resent every deploy, same reason
        # as the plain `deploy` job above: AWS silently clears it if
        # omitted, and this must be JSON, not CLI shorthand (shorthand
        # silently no-ops on this API — confirmed against real staging
        # infra). Kong doesn't expose a `services` entry of its own (see
        # terraform/kong.tf) — it only needs enabled+namespace to get the
        # Envoy sidecar that lets it resolve books-api's Service Connect DNS
        # name; without this, Kong's upstream calls fail with "name
        # resolution failed" even though books-api's own config is correct.
        run: |
          SERVICE_CONNECT_CONFIG='{"enabled":true,"namespace":"'"${NAME_PREFIX}"'.internal"}'
          aws ecs update-service \
            --cluster "$NAME_PREFIX" \
            --service "$NAME_PREFIX-kong" \
            --task-definition "${{ steps.register.outputs.arn }}" \
            --service-connect-configuration "$SERVICE_CONNECT_CONFIG" \
            --force-new-deployment

          # See the plain `deploy` job's identical loop above for why this
          # retries instead of failing on the first timeout — a brand-new
          # environment's first-ever Kong deploy hits this every time (empty
          # ECR repo when Terraform creates the service), confirmed directly
          # against real staging infra.
          for attempt in 1 2 3; do
            if aws ecs wait services-stable --cluster "$NAME_PREFIX" --services "$NAME_PREFIX-kong"; then
              exit 0
            fi
            echo "Still not stable after wait cycle $attempt/3 — checking again (this is expected on a service's very first deploy)."
          done
          echo "::error::$NAME_PREFIX-kong did not stabilize after 3 wait cycles (~30 min) — this is past the first-deploy cold-start window, so something else is actually wrong. Check ECS service events."
          exit 1
