name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.5.11"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff format --check .
          uv run ruff check --output-format=github .
      - name: Type check
        run: uv run mypy src

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Dependency vulnerability scan
        # --with, not a project dependency — this is a CI-only tool, not
        # something the app needs installed. Scans the synced venv above
        # against the PyPA Advisory DB / OSV; fails the build on any match.
        run: uv run --with pip-audit pip-audit

  test:
    runs-on: ubuntu-latest
    # No service container — tests run against an in-process moto server
    # (see tests/conftest.py), not a real or containerized DynamoDB.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: Tests
        run: uv run pytest --cov --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: books-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for vulnerabilities (report only)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: books-api:ci
          severity: CRITICAL,HIGH
          exit-code: "0" # visibility only — see the gated CRITICAL-only step below
      - name: Scan image for vulnerabilities (fails the build)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: books-api:ci
          severity: CRITICAL
          exit-code: "1"
          # CRITICAL-only so this doesn't immediately break on every
          # pre-existing HIGH finding in the base image the first time this
          # runs — tighten to CRITICAL,HIGH once that backlog's addressed.
      - name: Smoke test the image
        run: |
          docker run -d --name api -p 8000:8000 \
            -e OTEL_ENABLED=false \
            books-api:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8000/healthz && break || sleep 1
          done
          curl -fsS http://localhost:8000/healthz
          docker rm -f api
