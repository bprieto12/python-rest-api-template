name: Terraform

# Three ways in, mirroring cd.yml's release model exactly:
# - A PR touching terraform/ gets a `plan` for BOTH environments (matrix
#   below) — a change here can break staging or production differently
#   (e.g. a resource that only exists once free-tier capacity runs out),
#   so both get checked before merge.
# - A push to main auto-applies to STAGING. A push of a v* tag
#   auto-applies to PRODUCTION — a "release" promotes whatever's in
#   terraform/ at that commit, same as it promotes the already-built image
#   in cd.yml. Deliberately NOT restricted to commits that touch
#   terraform/ (unlike the PR trigger above) — a real promotion, and
#   re-applying unchanged config is a fast no-op, not a risk.
# - workflow_dispatch runs `plan` (default) or `apply` against the one
#   environment you pick, for an on-demand re-apply with no new commit/tag.
#
# Backend bucket/region are shared infra (one bucket, one key, isolated by
# Terraform workspace — see terraform/environment.tf) and come from
# repository-level vars. hosted_zone_name/domain_name and the Terraform
# deploy role differ per environment and come from that environment's own
# GitHub Environment vars/secrets — see terraform/README.md.

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      action:
        description: plan (safe, default) or apply
        required: true
        type: choice
        options: [plan, apply]
        default: plan
      environment:
        description: Environment to target
        required: true
        type: choice
        options: [staging, production]
        default: staging

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write # OIDC federation into AWS — no static keys
  contents: read

jobs:
  fmt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2" # bump alongside required_version in versions.tf; must stay >= 1.10 for native S3 state locking
      - working-directory: terraform
        run: terraform fmt -check -recursive

  plan:
    needs: fmt-check
    if: github.event_name == 'pull_request' || inputs.action == 'plan'
    strategy:
      fail-fast: false
      matrix:
        # A PR checks both environments; workflow_dispatch checks only the
        # one picked.
        environment: ${{ github.event_name == 'pull_request' && fromJSON('["staging", "production"]') || fromJSON(format('["{0}"]', inputs.environment)) }}
    runs-on: ubuntu-latest
    # Each environment's own GitHub Environment — separate TF_DEPLOY_ROLE_ARN
    # per environment (least privilege: staging's role can't touch
    # production's resources), separate HOSTED_ZONE_NAME/DOMAIN_NAME.
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2" # must stay >= 1.10 for native S3 state locking (use_lockfile)

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=books-api.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Select workspace
        working-directory: terraform
        run: terraform workspace select -or-create "${{ matrix.environment }}"

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        env:
          TF_VAR_hosted_zone_name: ${{ vars.HOSTED_ZONE_NAME }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
        run: terraform plan -input=false

  apply:
    needs: fmt-check
    # A push event targets staging (a branch push, i.e. main) or
    # production (a tag push, i.e. a v* release) automatically, based on
    # ref_type — same rule cd.yml's set-environment job uses. workflow_dispatch
    # picks its own environment explicitly via inputs.environment instead.
    if: |
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_type == 'tag' && 'production' || 'staging') }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.2"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=books-api.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Select workspace
        working-directory: terraform
        run: terraform workspace select -or-create "${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_type == 'tag' && 'production' || 'staging') }}"

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_hosted_zone_name: ${{ vars.HOSTED_ZONE_NAME }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
        run: terraform apply -input=false -auto-approve
