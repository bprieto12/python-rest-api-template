name: Terraform

# Two ways in:
# - A PR touching terraform/ gets a `plan` automatically.
# - workflow_dispatch runs `plan` (default) or `apply` on demand.
#
# Backend config and the two required variables (hosted_zone_name,
# domain_name) come from the "production" GitHub Environment's vars/secrets,
# not from backend.hcl / terraform.tfvars — those are gitignored and never
# exist in this checkout. See terraform/README.md for what's needed there.

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: plan (safe, default) or apply
        required: true
        type: choice
        options: [plan, apply]
        default: plan

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write # OIDC federation into AWS — no static keys
  contents: read

jobs:
  fmt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5" # bump alongside required_version in versions.tf; must stay >= 1.10 for native S3 state locking
      - working-directory: terraform
        run: terraform fmt -check -recursive

  terraform:
    needs: fmt-check
    runs-on: ubuntu-latest
    # Same "production" Environment CD's deploy job uses (for the vars below)
    # — NOT the same role. TF_DEPLOY_ROLE_ARN is deliberately a separate,
    # broader secret from CD's AWS_DEPLOY_ROLE_ARN; see terraform/README.md's
    # IAM section for why they shouldn't be merged. If you add required
    # reviewers to this Environment, both plan and apply pause for approval,
    # since they share this job's `environment:` key.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC claims (TEMPORARY — remove once role assumption works)
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value' | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5" # must stay >= 1.10 for native S3 state locking (use_lockfile)

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=books-api.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        if: github.event_name == 'pull_request' || inputs.action == 'plan'
        working-directory: terraform
        env:
          TF_VAR_hosted_zone_name: ${{ vars.HOSTED_ZONE_NAME }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
        run: terraform plan -input=false

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        working-directory: terraform
        env:
          TF_VAR_hosted_zone_name: ${{ vars.HOSTED_ZONE_NAME }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
        run: terraform apply -input=false -auto-approve
