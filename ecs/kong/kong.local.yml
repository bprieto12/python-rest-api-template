_format_version: "3.0"

# Local-only: docker-compose's api container has no Cognito to check a JWT
# against (CLAUDE.md — the app itself doesn't know auth exists, and neither
# does local dev generally), so this skips the `jwt` plugin entirely rather
# than fake a token. It keeps the one thing actually worth exercising
# locally: the rate-limiting behavior itself (429 once the limit trips).
# The real per-environment kong.yml (deployed, JWT-enforced, per-consumer
# limits) is generated by ecs/kong/render_config.py — see terraform/kong.tf
# and .github/workflows/cd.yml's build-and-push-kong job.
services:
  - name: books-api
    url: http://api:8000
    routes:
      - name: books-api-route
        paths:
          - /
        strip_path: false

plugins:
  - name: rate-limiting
    config:
      minute: 20
      policy: local
